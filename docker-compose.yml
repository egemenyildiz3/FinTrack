services:
  backend:
    build:
      context: ./backend/FinTrack.Api
    container_name: fintrack-backend
    env_file:
      - path: .env
        required: false
    environment:
      - EXTRA_BACKUP_PATH=${EXTRA_BACKUP_PATH:-}
    volumes:
      - fintrack-data:/data
      - ${EXTRA_BACKUP_PATH:-/tmp/fintrack-noop}:${EXTRA_BACKUP_PATH:-/tmp/fintrack-noop}
    expose:
      - "8080"
    ports:
      - "5099:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fintrack-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  fintrack-data:
