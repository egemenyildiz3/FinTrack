services:
  backend:
    image: ghcr.io/egemenyildiz3/fintrack-backend:latest
    container_name: fintrack-backend
    volumes:
      - fintrack-data:/data
      - /home/egemen/file-storage/information:/mnt/extra-backups
    environment:
      - EXTRA_BACKUP_PATH=/mnt/extra-backups
    expose:
      - "8080"
    ports:
      - "5099:8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/egemenyildiz3/fintrack-frontend:latest
    container_name: fintrack-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  fintrack-data: